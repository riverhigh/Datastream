<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataStream Dashboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f9f9f9;
  }
  h1, h2 { text-align: center; }
  #auth, #dashboard {
    max-width: 800px;
    margin: 50px auto;
    padding: 20px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  input, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
  }
  input { width: calc(100% - 24px); }
  button { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
  th { background-color: #007bff; color: white; }
  tr:nth-child(even) { background-color: #f2f2f2; }
  .modal {
    display: none; 
    position: fixed; 
    z-index: 999; 
    padding-top: 100px; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgba(0,0,0,0.5);
  }
  .modal-content {
    background-color: white;
    margin: auto;
    padding: 20px;
    border-radius: 8px;
    width: 80%;
    max-width: 600px;
  }
  .close {
    color: #aaa;
    float: right;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>DataStream Dashboard</h1>

<!-- Auth Section -->
<div id="auth">
  <h2>Register / Login</h2>
  <input type="text" id="username" placeholder="Username"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button onclick="registerUser()">Register</button>
  <button onclick="loginUser()">Login</button>
  <p id="authMsg" style="text-align:center; color:red;"></p>
</div>

<!-- Main Dashboard -->
<div id="dashboard">
  <h2>API Key</h2>
  <input type="text" id="apiKey" readonly>
  <button onclick="loadRecords()">Load Records</button>

  <hr>

  <h2>Upload CSV for Analysis</h2>
  <input type="file" id="csvFile">
  <button onclick="uploadFile()">Upload & Analyze</button>

  <hr>

  <h2>Your Analyses</h2>
  <table id="recordsTable">
    <thead>
      <tr>
        <th>Analysis ID</th>
        <th>Preview</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Modal for preview -->
<div id="previewModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>CSV Preview</h3>
    <pre id="previewContent"></pre>
  </div>
</div>

<script>
const API_BASE = "https://datastream.onrender.com";

// ----------------------
// Auth Functions
// ----------------------
async function registerUser() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");
  if (!username || !password) { msg.textContent = "Enter both username and password."; return; }

  try {
    const res = await fetch(`${API_BASE}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    msg.style.color = "green";
    msg.textContent = `Registered! Your API key: ${data.api_key}`;
    document.getElementById("apiKey").value = data.api_key;
    showDashboard();
  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "Error registering: " + err;
  }
}

async function loginUser() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");
  if (!username || !password) { msg.textContent = "Enter both username and password."; return; }

  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    msg.style.color = "green";
    msg.textContent = "Login successful!";
    document.getElementById("apiKey").value = data.api_key;
    showDashboard();
  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "Error logging in: " + err;
  }
}

function showDashboard() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}

// ----------------------
// Helper: API headers
// ----------------------
function headers() {
  const apiKey = document.getElementById("apiKey").value;
  return { "X-API-Key": apiKey };
}

// ----------------------
// Load user records
// ----------------------
async function loadRecords() {
  const tableBody = document.querySelector("#recordsTable tbody");
  tableBody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";
  try {
    const res = await fetch(`${API_BASE}/records`, { headers: headers() });
    const data = await res.json();
    tableBody.innerHTML = "";
    data.records.forEach(record => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${record.id}</td>
        <td><button onclick="showPreview('${record.id}')">View</button></td>
        <td>${record.created_at}</td>
        <td><button onclick="deleteRecord('${record.id}')">Delete</button></td>
      `;
      tableBody.appendChild(tr);
    });
  } catch (err) {
    tableBody.innerHTML = `<tr><td colspan="4">Error loading records: ${err}</td></tr>`;
  }
}

// ----------------------
// Show CSV preview
// ----------------------
async function showPreview(id) {
  try {
    const res = await fetch(`${API_BASE}/analysis/${id}`, { headers: headers() });
    const data = await res.json();
    const preview = JSON.stringify(data.result.preview, null, 2);
    document.getElementById("previewContent").textContent = preview;
    document.getElementById("previewModal").style.display = "block";
  } catch (err) {
    alert("Error fetching preview: " + err);
  }
}

function closeModal() {
  document.getElementById("previewModal").style.display = "none";
}

// ----------------------
// Upload CSV file
// ----------------------
async function uploadFile() {
  const fileInput = document.getElementById("csvFile");
  if (!fileInput.files.length) { alert("Select a CSV file"); return; }

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  try {
    const res = await fetch(`${API_BASE}/analyze`, {
      method: "POST",
      headers: headers(),
      body: formData
    });
    const data = await res.json();
    alert(`Analysis completed! ID: ${data.analysis_id}`);
    loadRecords();
  } catch (err) {
    alert("Error uploading file: " + err);
  }
}

// ----------------------
// Delete analysis
// ----------------------
async function deleteRecord(id) {
  if (!confirm("Are you sure you want to delete this analysis?")) return;
  try {
    await fetch(`${API_BASE}/delete/${id}`, {
      method: "DELETE",
      headers: headers()
    });
    loadRecords();
  } catch (err) {
    alert("Error deleting analysis: " + err);
  }
}
</script>

</body>
</html>
